<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Oguzhanın Cenneti</title>
    <style>
        /* RGB Renk Değiştirme Animasyonu */
        @keyframes rgbAnimasyonu {
            0% { color: #ff0000; text-shadow: 0 0 5px rgba(255, 0, 0, 0.2); }       
            17% { color: #ff7f00; text-shadow: 0 0 5px rgba(255, 127, 0, 0.2); }    
            33% { color: #ffff00; text-shadow: 0 0 5px rgba(255, 255, 0, 0.2); }    
            50% { color: #00ff00; text-shadow: 0 0 5px rgba(0, 255, 0, 0.2); }      
            67% { color: #0000ff; text-shadow: 0 0 5px rgba(0, 0, 255, 0.2); }      
            83% { color: #8b00ff; text-shadow: 0 0 5px rgba(139, 0, 255, 0.2); }    
            100% { color: #ff0000; text-shadow: 0 0 5px rgba(255, 0, 0, 0.2); }     
        }
        .rgb-baslik {
            font-weight: bold;
            font-size: 20px; 
            animation: rgbAnimasyonu 5s linear infinite; 
            transition: transform 0.2s;
        }
        .rgb-baslik:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px; padding-bottom: 50px;">
    <h1>Hoşgeldiniz, burada yaptığınız her harekete dikkat edin.</h1>
    <p>Bu site içerisinde türlü güzellikler sizi bekliyor, yeni içerik ve yenilikler için lütfen ooguzhanayy@gmail.com üzerinden iletişime geçiniz.</p>

    <!-- Tıklanabilir başlık alanı -->
    <details id="fotdetay" style="margin-top: 65px; cursor: pointer;" onclick="fotoyuGoster(event)">
        <summary class="rgb-baslik" style="outline: none;">Bu fotoğrafı görmek istediğinize emin misiniz?</summary>
        <div style="margin-top: 15px;">
            <img src="ayak.jpg" alt="Açıklama" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);">
            <p style="margin-top: 15px; font-weight: bold; color: #333; font-size: 16px;">yani bunu sen istemiştin</p>
        </div>
    </details>

    <!-- Yorum Bölümü -->
    <hr style="margin-top: 50px; width: 60%; border: 0; border-top: 1px solid #ccc;">
    
    <div style="max-width: 450px; margin: 30px auto; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3 style="text-align: center; margin-top: 0; color: #333;">Ziyaretçi Yorumları</h3>
        
        <input type="text" id="kullaniciAdi" placeholder="Kullanıcı Adınız" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
        
        <textarea id="yorumMetni" placeholder="Yorumunuzu buraya yazın..." rows="3" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; resize: vertical;"></textarea>
        
        <button id="yorumGonderBtn" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px;">Yorumu Gönder</button>

        <!-- Yorumların Listeleneceği Alan -->
        <div id="yorumListesi" style="margin-top: 20px;"></div>
    </div>

    <!-- Fotoğraf Onay Scripti -->
    <script>
        let onaylandi = false;
        function fotoyuGoster(event) {
            const detay = document.getElementById('fotdetay');
            if (!onaylandi && !detay.open) {
                event.preventDefault();
                let karar = confirm("Tekrardan emin misin!!!!");
                if (karar) {
                    onaylandi = true;
                    detay.open = true;
                }
            }
        }
    </script>

    <!-- Ortak Veritabanı (Firebase) Scripti -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Senin Firebase Veritabanı Adresin
        const firebaseConfig = {
            databaseURL: "https://cennetyorumlar-48e05-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Firebase'i başlat
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const yorumlarRef = ref(db, 'ziyaretci_yorumlari');

        // Veritabanındaki yorumları anlık olarak dinle ve ekrana bas
        onValue(yorumlarRef, (snapshot) => {
            const liste = document.getElementById('yorumListesi');
            liste.innerHTML = ""; // Listeyi temizle
            
            const data = snapshot.val();
            if (data) {
                const yorumDizisi = Object.values(data);
                
                // --- TARİHE GÖRE SIRALAMA ALGORİTMASI ---
                // Yorumları eskiden yeniye doğru sıraya dizer (1453 en başa geçer)
                yorumDizisi.sort((a, b) => {
                    try {
                        const parcaA = a.tarih.split(' ');
                        const tarihA = parcaA[0].split('.');
                        const saatA = parcaA[1] ? parcaA[1].split(/[:.]/) : [0,0];
                        const dateA = new Date(tarihA[2], tarihA[1]-1, tarihA[0], saatA[0], saatA[1]);

                        const parcaB = b.tarih.split(' ');
                        const tarihB = parcaB[0].split('.');
                        const saatB = parcaB[1] ? parcaB[1].split(/[:.]/) : [0,0];
                        const dateB = new Date(tarihB[2], tarihB[1]-1, tarihB[0], saatB[0], saatB[1]);

                        return dateA - dateB;
                    } catch (e) {
                        return 0;
                    }
                });

                // Sıralanmış diziyi ekrana bas (Eski olanlar alta doğru itilir)
                yorumDizisi.forEach(yorum => {
                    ekranaYorumBas(yorum.ad, yorum.metin, yorum.tarih);
                });
            }
        });

        // Gönder butonuna tıklandığında çalışacak kod
        document.getElementById('yorumGonderBtn').addEventListener('click', () => {
            const adInput = document.getElementById('kullaniciAdi');
            const metinInput = document.getElementById('yorumMetni');
            
            const ad = adInput.value.trim();
            const metin = metinInput.value.trim();

            if (ad === "" || metin === "") {
                alert("Lütfen hem kullanıcı adını hem de yorum kısmını doldurun!");
                return;
            }

            // Tarih formatını sabitle (Fatih'in formatı olan DD.MM.YYYY ile aynı olsun)
            const simdi = new Date();
            const tarih = ("0" + simdi.getDate()).slice(-2) + "." + 
                          ("0" + (simdi.getMonth() + 1)).slice(-2) + "." + 
                          simdi.getFullYear() + " " + 
                          ("0" + simdi.getHours()).slice(-2) + ":" + 
                          ("0" + simdi.getMinutes()).slice(-2);

            // Yorumu Firebase veritabanına gönder
            push(yorumlarRef, {
                ad: ad,
                metin: metin,
                tarih: tarih
            });

            // Kutuları temizle
            adInput.value = "";
            metinInput.value = "";
        });

        // Yorumları görsel olarak oluşturan fonksiyon
        function ekranaYorumBas(ad, metin, tarih) {
            const liste = document.getElementById('yorumListesi');
            const yeniYorum = document.createElement('div');
            yeniYorum.style.borderBottom = "1px solid #e0e0e0";
            yeniYorum.style.padding = "10px 0";
            yeniYorum.style.wordWrap = "break-word";
            
            const baslik = document.createElement('div');
            baslik.innerHTML = `<strong style="color: #007bff;"></strong> <span style="font-size: 11px; color: #888; float: right;">${tarih}</span>`;
            baslik.querySelector('strong').textContent = ad;

            const icerik = document.createElement('p');
            icerik.style.margin = "5px 0 0 0";
            icerik.style.color = "#444";
            icerik.textContent = metin;

            yeniYorum.appendChild(baslik);
            yeniYorum.appendChild(icerik);

            // Her yeni gelen yorumu EN ÜSTE yerleştirir
            liste.prepend(yeniYorum);
        }
    </script>
</body>
</html>
